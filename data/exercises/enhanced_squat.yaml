# Enhanced Squat Analysis Configuration
# Provides comprehensive biomechanical analysis for squat exercises

name: "Enhanced Squat"
description: "Comprehensive squat analysis with enhanced biomechanics"

# Body segments to visualize
segments:
  - ["shoulder", "hip"]
  - ["hip", "knee"] 
  - ["knee", "ankle"]
  - ["shoulder", "elbow"]
  - ["elbow", "wrist"]

# Angles to calculate
angles:
  - id: "knee"
    label: "Knie"
    points: ["hip", "knee", "ankle"]
    description: "Knee flexion angle (180° = straight, <90° = deep squat)"
    
  - id: "hip" 
    label: "Hüfte"
    points: ["shoulder", "hip", "knee"]
    description: "Hip flexion angle"
    
  - id: "ankle"
    label: "Sprunggelenk"
    points: ["knee", "ankle", "heel"]
    description: "Ankle dorsiflexion angle"
    
  - id: "trunk"
    label: "Rumpf"
    points: ["hip_down", "hip", "shoulder"]
    description: "Trunk inclination from vertical"

# Enhanced moment calculations with anthropometric scaling
moments:
  # Knee moment with enhanced biomechanics
  knee: >
    (body_weight_N * thigh_mass_pct * thigh_length * 0.5 * sin_deg(180 - angles['knee']) +
     external_load_N * thigh_length * 0.6 * sin_deg(180 - angles['knee'])) * scale_factor
  
  # Hip moment considering trunk inclination
  hip: >
    (body_weight_N * torso_mass_pct * torso_length * 0.5 * sin_deg(angles.get('trunk', 0)) +
     total_N * thigh_length * 0.4 * sin_deg(180 - angles['hip'])) * scale_factor
  
  # Ankle moment for balance analysis
  ankle: >
    total_N * 0.15 * sin_deg(angles.get('ankle', 90) - 90) * scale_factor

# Visualization settings
overlays:
  arrows_at: ["knee", "hip", "ankle"]

# Analysis thresholds and recommendations
thresholds:
  knee_angle:
    excellent: [80, 120]
    good: [70, 130] 
    needs_work: [60, 140]
    
  hip_angle:
    excellent: [70, 110]
    good: [60, 120]
    needs_work: [50, 130]
    
  trunk_angle:
    excellent: [0, 15]
    good: [0, 25]
    needs_work: [0, 35]
    
  knee_moment:
    low: [0, 100]
    medium: [100, 200]
    high: [200, 400]
    
  hip_moment:
    low: [0, 150]
    medium: [150, 300]
    high: [300, 500]

# Form cues based on measurements
form_cues:
  knee_too_straight: "Gehe tiefer in die Hocke für bessere Muskelaktivierung"
  knee_too_bent: "Achte auf kontrollierte Bewegung, nicht zu tief"
  excessive_forward_lean: "Halte den Oberkörper aufrechter"
  knee_valgus: "Drücke die Knie nach außen"
  heel_lift: "Halte die Fersen am Boden"

# Safety warnings
safety_checks:
  max_knee_moment: 500  # N·m
  max_hip_moment: 600   # N·m
  min_knee_angle: 45    # degrees
  max_trunk_lean: 45    # degrees
